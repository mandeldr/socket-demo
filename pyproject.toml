[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scanner"
version = "0.1.0"
description = "Open source dependency risk scanner: resolves transitive dependencies and reports known vulnerabilities."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "requests>=2.31",
    "packaging>=23.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
scanner = "scanner.cli:main"

[tool.setuptools]
# Listed explicitly rather than auto-discovered, so a new subpackage has to be
# added here on purpose. Leaving one out installs a package that imports fine
# from the source tree and fails from the wheel.
packages = ["scanner", "scanner.manifests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests compare our resolution against uv's. They are deselected by
# default so the ordinary suite stays offline and fast; run them with
# `pytest -m network`.
addopts = "-m 'not network'"
markers = ["network: compares against a real resolver over the network"]

[tool.mypy]
python_version = "3.10"
# Without this an unannotated function is skipped entirely rather than checked,
# so a missing annotation quietly turns type checking off for that function.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
