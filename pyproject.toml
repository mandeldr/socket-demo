[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scanner"
version = "0.1.0"
description = "Open source dependency risk scanner: resolves transitive dependencies and reports known vulnerabilities."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "requests>=2.31",
    "packaging>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
scanner = "scanner.cli:main"

[tool.setuptools]
packages = ["scanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
# Without this an unannotated function is skipped entirely rather than checked,
# so a missing annotation quietly turns type checking off for that function.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
