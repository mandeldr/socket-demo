line-length = 100
target-version = "py314"

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (real bugs: undefined names, unused imports)
    "I",    # import sorting
    "N",    # pep8-naming  <- catches camelCase
    "UP",   # pyupgrade (modern syntax)
    "B",    # bugbear (likely bugs)
]
