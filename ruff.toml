line-length = 100
# Match requires-python in pyproject.toml, so pyupgrade does not rewrite code
# into syntax newer than the oldest Python this package claims to support.
target-version = "py310"

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (real bugs: undefined names, unused imports)
    "I",    # import sorting
    "N",    # pep8-naming  <- catches camelCase
    "UP",   # pyupgrade (modern syntax)
    "B",    # bugbear (likely bugs)
]
